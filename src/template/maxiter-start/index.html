@header
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Maxiter Start</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
@header
@body
<body>
  <div class="grid"></div>
  <div class="glow" id="glow"></div>

  <header>
    <a class="brand" href="#" aria-label="Maxiter">
      <img src="assets/maxiter-logo.png" alt="">
      <strong>MAXITER</strong>
    </a>
    <span class="status"><i></i> project ready</span>
  </header>

  <main>
    <section class="welcome">
      <div class="mark">
        <img src="assets/maxiter-logo.png" alt="Maxiter">
      </div>

      <p class="eyebrow">MAXITER / PHP FRAMEWORK</p>
      <h1>It works.</h1>
      
      <p class="lead">
        Your Maxiter project is ready.<br>
        Now build something amazing.
      </p>

      <div class="actions">
        <a
          class="primary"
          href="https://maxiter-docs.vercel.app/"
          target="_blank"
          rel="noreferrer"
        >
          Documentation <span>↗</span>
        </a>

        <a
          class="secondary"
          href="https://github.com/maxiter-php/maxiter"
          target="_blank"
          rel="noreferrer"
        >
          GitHub
        </a>
      </div>

      <div class="terminal" aria-label="Project information">
        <div class="terminal-top">
          <span></span>
          <span></span>
          <span></span>
          <b>maxiter</b>
        </div>
        
        <div class="terminal-body">
          <span class="prompt">❯</span>
          <span>application status</span>
          <strong>READY</strong>
          <i class="cursor"></i>
        </div>
      </div>
    </section>
  </main>

@body
@footer
  <footer>
    <span>MAXITER</span>
    <span>PHP FRAMEWORK</span>
  </footer>

  <script src="./assets/js/script.js"></script>
</body>
</html>
@footer
